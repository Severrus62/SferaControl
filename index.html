<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>LED · Управление (Google Sheets)</title>
<style>
/* CSS остается прежним, можно использовать из предыдущего ответа */
</style></head><body>
<header><h1>LED · Проекты (Онлайн)</h1></header>
<div class="bar">
  <button class="primary" onclick="openEditor()">+ Новый проект</button>
  <button onclick="fetchProjects()">↻ Обновить данные</button>
</div>
<main>
  <div class="scroll">
    <table id="projectsTable"><thead><tr><th>Проект</th><th>Размер (мм)</th><th>Статус</th><th>Ссылки</th><th>Действия</th></tr></thead><tbody id="tbody"></tbody></table>
  </div>
</main>

<script>
// ВСТАВЬТЕ СЮДА ВАШ URL ИЗ SHEETDB
const API_URL = 'https://sheetdb.io/api/v1/h8ovh4ooecm1z'; 

async function fetchProjects() {
  const response = await fetch(API_URL);
  const data = await response.json();
  render(data);
}
function render(data) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = data.map(p => `<tr>
    <td><b>${p.name}</b><br><small>${p.client}</small></td>
    <td>${p.widthMm} x ${p.heightMm} мм</td>
    <td>${p.state}</td>
    <td><a href="${p.calcUrl}" target="_blank">Расчёт</a> | <a href="${p.url}" target="_blank">B24</a></td>
    <td><button onclick="deleteProject('${p.id}')">Удалить</button></td>
  </tr>`).join('');
}

async function saveProject(e) {
  e.preventDefault();
  const formData = new FormData(e.target);
  const data = Object.fromEntries(formData);
  
  // Если id нет (новый проект), добавляем уникальный ID
  if (!data.id) data.id = Date.now();

  await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ data: [data] })
  });
  
  document.getElementById('editor').close();
  fetchProjects();
}

async function deleteProject(id) {
  await fetch(`${API_URL}/id/${id}`, { method: 'DELETE' });
  fetchProjects();
}

fetchProjects();
</script>
</body></html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LED · Управление проектами</title>
<style>
:root{--bg:#f4f7fb;--ink:#1a2b42;--muted:#62748e;--line:#dce4ef;--blue:#2264da;--green:#167651;--red:#b72d44;--accent:#ff9800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,Arial}
header{background:#142640;color:white;padding:20px 24px}h1{margin:0 0 5px;font-size:22px}
.bar{display:flex;gap:8px;padding:20px;background:white;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:8px;padding:8px 12px;transition:all .15s}
button.primary{background:var(--blue);color:white;border:0}button.danger{color:var(--red)}
main{max-width:1800px;margin:auto;padding:20px}.scroll{overflow:auto;background:white;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left}
th{background:#eaf0f8}.badge{padding:3px 8px;border-radius:6px;background:#eaf0f8;font-size:12px;font-weight:500}
.red{color:var(--red);background:#ffedf0}.green{color:var(--green);background:#e6f6ee}.blue{color:var(--blue);background:#e7efff}
dialog{width:min(1000px,95vw);border:0;border-radius:12px;padding:20px}
.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.wide{grid-column:1/-1}.half{grid-column:span 2}
</style></head><body>
<header><h1>LED · Система управления проектами</h1></header>
<div class="bar">
  <button class="primary" onclick="openEditor()">+ Новый проект</button>
  <button onclick="downloadBackup()">Скачать БД (JSON)</button>
  <button onclick="document.getElementById('file').click()">Загрузить БД</button>
  <input type="file" id="file" hidden onchange="importData(event)">
  <button class="danger" onclick="clearData()">Очистить всё</button>
</div>
<main>
  <div class="scroll">
    <table id="projectsTable"><thead><tr><th>Проект</th><th>Габариты (мм)</th><th>Статус</th><th>Сроки</th><th>Сметы / Ссылки</th><th>Действия</th></tr></thead><tbody id="tbody"></tbody></table>
  </div>
</main>

<dialog id="editor"><form id="form" onsubmit="saveProject(event)">
  <div class="formgrid">
    <h2 class="wide" id="editTitle">Проект</h2>
    <input type="hidden" name="id">
    <label class="half">Название<input name="name" required></label>
    <label>Заказчик<input name="client"></label>
    <label>Статус<select name="state"><option>В работе</option><option>Завершён</option></select></label>
    <label>Ширина (мм)<input name="widthMm" type="number"></label>
    <label>Высота (мм)<input name="heightMm" type="number"></label>
    <label>Ссылка на расчёт<input name="calcUrl"></label>
    <label>Битрикс24 URL<input name="url"></label>
    <button type="submit" class="primary wide">Сохранить</button>
    <button type="button" class="wide" onclick="this.closest('dialog').close()">Отмена</button>
  </div>
</form></dialog>

<script>
let projects = JSON.parse(localStorage.getItem('led_db') || '[]');
function render() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = projects.map(p => `<tr>
    <td><b>${p.name}</b><br><small>${p.client}</small></td>
    <td>${p.widthMm} x ${p.heightMm} мм</td>
    <td><span class="badge ${p.state==='Завершён'?'green':'blue'}">${p.state}</span></td>
    <td><button onclick="openEditor('${p.id}')">Редактировать</button></td>
    <td><a href="${p.calcUrl}" target="_blank">Расчёт</a> | <a href="${p.url}" target="_blank">B24</a></td>
    <td><button class="danger" onclick="deleteProject('${p.id}')">Удалить</button></td>
  </tr>`).join('');
}
function openEditor(id) {
  const p = projects.find(x => x.id === id) || {id: Date.now(), name:'', client:'', state:'В работе', widthMm:'', heightMm:'', calcUrl:'', url:''};
  const f = document.getElementById('form');
  for(let k in p) if(f.elements[k]) f.elements[k].value = p[k];
  document.getElementById('editTitle').textContent = id ? 'Редактирование' : 'Новый проект';
  document.getElementById('editor').showModal();
}
function saveProject(e) {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  const idx = projects.findIndex(x => x.id == data.id);
  if(idx > -1) projects[idx] = data; else projects.push(data);
  localStorage.setItem('led_db', JSON.stringify(projects));
  document.getElementById('editor').close();
  render();
}
function deleteProject(id) {
  if(confirm('Удалить?')) { projects = projects.filter(x => x.id != id); localStorage.setItem('led_db', JSON.stringify(projects)); render(); }
}
function downloadBackup() {
  const blob = new Blob([JSON.stringify(projects)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'projects.json'; a.click();
}
function importData(e) {
  const reader = new FileReader();
  reader.onload = () => { projects = JSON.parse(reader.result); localStorage.setItem('led_db', JSON.stringify(projects)); render(); };
  reader.readAsText(e.target.files[0]);
}
function clearData() { if(confirm('Очистить всё?')) { projects = []; localStorage.setItem('led_db', '[]'); render(); } }
render();
</script></body></html>
